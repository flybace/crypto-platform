[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-platform"
version = "0.1.0"
description = "Independent multi-market digital asset research and controlled execution platform"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
runtime = [
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<6",
    "httpx>=0.27,<1",
    "websockets>=15,<16",
    "uvicorn[standard]>=0.30,<1",
    "numpy>=2,<3",
    "pandas>=2.2,<3",
    "pyarrow>=16,<20",
]
test = [
    "pytest>=8,<9",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
